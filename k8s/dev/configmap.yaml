apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ecommerce-dev
data:
  POSTGRES_DB: ecommerce
  POSTGRES_USER: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: ecommerce-dev
data:
  DB_HOST: postgres-service
  DB_PORT: "5432"
  DB_NAME: ecommerce
  DB_USER: postgres
  ENVIRONMENT: development
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: ecommerce-dev
data:
  BACKEND_URL: http://backend-service:5000
  ENVIRONMENT: development
