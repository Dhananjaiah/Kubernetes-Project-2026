apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce-dev
  labels:
    app: api-gateway
    tier: gateway
spec:
  type: ClusterIP
  ports:
    - port: 5004
      targetPort: 5004
      protocol: TCP
      name: http
  selector:
    app: api-gateway

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce-dev
  labels:
    app: api-gateway
    tier: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004
              name: http
          env:
            - name: FLASK_ENV
              value: "development"
            - name: ENVIRONMENT
              value: "development"
            - name: PRODUCT_SERVICE_URL
              value: "http://backend-service:5000"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:5001"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:5002"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:5003"
          livenessProbe:
            httpGet:
              path: /live
              port: 5004
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 5004
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
