apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: ecommerce-prod
data:
  DB_HOST: postgres-service
  DB_PORT: "5432"
  DB_NAME: ecommerce
  DB_USER: postgres
  ENVIRONMENT: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: ecommerce-prod
data:
  BACKEND_URL: http://backend-service:5000
  ENVIRONMENT: production
